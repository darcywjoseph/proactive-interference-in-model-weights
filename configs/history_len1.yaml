# Amount of history: L1 and L3 on a history of 1 fact, the first of each
# seed's length-10 history in configs/history.yaml (same picks, targets, probe,
# write seeds and recipe), trained for the same 96 steps per fact. With the L0
# (length 0) and length-10 units of results/history and the length-3 units of
# configs/history_len3.yaml, this gives four points on the history-length axis.
model: Qwen/Qwen3-1.7B
device: mps  # "cuda" on a cloud GPU
dtype: bfloat16
seed: 20261019  # picks each seed's history, targets and probe facts
facts: data/facts.jsonl
train: data/train_llm.jsonl
eval: data/eval.jsonl
out_dir: results/history_len1

levels: [L1, L3]
seeds: [0, 1, 2]
history:
  relations: [cup_winner_by_year, province_capital, company_ceo]
  length: 10  # drawn as in configs/history.yaml ...
  use: 1  # ... and only the first facts are written
  steps: 96  # per fact, as in configs/history.yaml
  mode: combined
targets_per_seed: 14
probe_per_seed: 10

write:
  steps: 24
  learning_rate: 2.0e-4  # PyYAML reads 2e-4 as a string
  rank: 16
  alpha: 32
  loss_on: response
  eval_every: 4

retro_steps: [16, 24]
probe_steps: [0, 16, 24]
units_per_process: 12  # see configs/history.yaml for the rerun loop

summary:
  steps: [16, 24]  # as configs/history.yaml, so AUC to the primary step matches across runs
  references: [L1]  # the similarity contrast L3-L1; L1-L0 needs results/history
  fit_threshold: -1.0  # nats; "fitted" once mean train log-prob reaches this
  grade: strict  # judged 2026-10-21 (run 20261021-163338); "correct" for names_target
  judge_cache: results/judge/judgments_v2.parquet
  bootstrap_draws: 20000
