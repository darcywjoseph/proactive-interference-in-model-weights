# Firmness of the old value (2026-10-23): configs/history_corrections.yaml at L1
# and L4, on histories trained for 240 steps (a quarter of 960), not
# verified. Does a less firm old value give way to its correction sooner?
# Compare with the L4 units of results/history_corrections. L1 (added the same
# day) separates the old value from how long the adapter was trained.
model: Qwen/Qwen3-1.7B
device: mps  # "cuda" on a cloud GPU
dtype: bfloat16
seed: 20261019  # picks each seed's history, as in configs/history_retention_large.yaml
facts: data/facts.jsonl
train: data/train_llm.jsonl
eval: data/eval.jsonl
out_dir: results/history_corrections_240

levels: [L1, L4]
corrections: true
seeds: [0, 1, 2, 3]
history:
  relations: [cup_winner_by_year, province_capital, company_ceo, isolated_from]
  length: 10
  steps: 24
  steps_by_relation: {isolated_from: 36}  # 1.5 times, as at 960
  mode: combined
targets_per_seed: 24  # the draw; the after-facts rotate through the next seed's 24
probe_per_seed: 0
retention:
  targets: 10
  after: 3
  per_target: true
real_probe: data/real_probe.jsonl

write:
  steps: 24
  learning_rate: 2.0e-4  # PyYAML reads 2e-4 as a string
  rank: 16
  alpha: 32
  loss_on: response
  eval_every: 4

retro_steps: [16, 24]
probe_steps: [0, 16, 24]  # the real probe
units_per_process: 12  # see configs/history.yaml for the rerun loop

summary:
  steps: [16, 24]
  references: [L1]
  fit_threshold: -1.0
  grade: strict  # judged in runs 20261023-080239 and 20261023-095118
  judge_cache: results/judge/judgments_v2.parquet
  bootstrap_draws: 20000
