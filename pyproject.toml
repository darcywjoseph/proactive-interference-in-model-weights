[project]
name = "proactive-interference"
version = "0.1.0"
description = "Proactive interference in sequential fact writes into model weights"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "transformers>=4.51",
    "peft>=0.14",
    "accelerate>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "anthropic>=1.15.0",
]

[dependency-groups]
dev = ["ruff>=0.7", "mypy>=1.13", "pytest>=8", "types-PyYAML", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-single-line = true
single-line-exclusions = ["collections.abc", "typing"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
